<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formular confirmări prezență</title></head>
<body>
<!-- Fișier necesar pentru Netlify: declară formularul "rsvp" în care ajung confirmările părinților. Nu îl șterge. -->
<form name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input name="bot-field">
<input name="session">
<input name="lesson">
<input name="date">
<input name="child">
<input name="answer">
</form>
<p>Formular de confirmare a prezenței. <a href="/">Înapoi la pagina clubului</a></p>
</body></html>
