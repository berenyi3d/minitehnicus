html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg)}
.kE{--c:#1aa6c9}.kP{--c:#c04a9f}.kC{--c:#f0a200}
header{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--bd);padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
header .in{max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:center}
.logo{flex:none;width:64px;height:64px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 1.5rem system-ui,sans-serif;overflow:hidden;box-shadow:0 4px 14px rgba(20,60,120,.18)}
.logo.img{background:none;overflow:visible;box-shadow:none;border-radius:0}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
header h1{margin:0;font-size:1.5rem;line-height:1.15;font-weight:700;letter-spacing:-.02em}
header p{margin:3px 0 0;color:var(--mu);font-size:.9rem;font-weight:500}
main{max-width:760px;margin:0 auto;padding:16px}
.stats{display:flex;gap:10px;margin:2px 0 0}
.stat{flex:1;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:12px 6px;text-align:center;font-size:.7rem;font-weight:600;letter-spacing:.02em;color:var(--mu)}
.stat b{display:block;font-size:1.7rem;line-height:1.15;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat:nth-child(1) b{color:var(--ac)}.stat:nth-child(2) b{color:var(--ok)}.stat:nth-child(3) b{color:var(--warn)}
.pb{height:6px;background:var(--soft);border-radius:3px;margin:14px 2px 16px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1aa6c9,#c04a9f);border-radius:3px;transition:width .4s}
.mb{margin:0 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mode{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-size:.72rem;font-weight:600;color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.bar input{flex:1 1 100%;width:100%;min-width:0;padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--glass2);color:var(--tx);font-size:1rem;-webkit-appearance:none;appearance:none}
.bar input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.chip{flex:0 1 auto;white-space:nowrap;padding:8px 15px;border-radius:99px;border:1px solid var(--bd);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--tx);font-size:.84rem;font-weight:600;cursor:pointer}
.chip.on{background:var(--acr);border-color:transparent;color:var(--onac)}
h2.sec{margin:26px 4px 10px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
details{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);margin:10px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"";width:8px;height:8px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);margin:-4px 2px 0 0;transition:transform .15s;flex:none}
details[open] summary:after{transform:rotate(-135deg);margin-top:4px}
.ring{order:-1;flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.ring i{font-style:normal;width:37px;height:37px;border-radius:50%;background:var(--ringbg);display:grid;place-items:center;font-size:.66rem;font-weight:700;font-variant-numeric:tabular-nums}
.ut{flex:1;min-width:0}.ut b{font-size:1rem;font-weight:650;display:block;line-height:1.3}.ut small{display:block;color:var(--mu);font-size:.76rem;margin-top:1px}
.ud{padding:0 16px 8px;color:var(--mu);font-size:.85rem;margin:0}
.ls{padding:0 8px 6px}
.l{display:flex;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--bd)}
.l input{-webkit-appearance:none;appearance:none;width:24px;height:24px;flex:none;border:2px solid rgba(120,120,128,.45);border-radius:50%;background:transparent;cursor:pointer;margin:0}
.l input:checked{background:var(--ok);border-color:var(--ok)}
.l input:checked:after{content:"";display:block;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin:2px 0 0 7px}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid rgba(120,120,128,.35);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff}
.ck.y{background:var(--ok);border-color:var(--ok)}
.lt{flex:1;min-width:0}
.lt a{color:var(--tx);text-decoration:none;font-weight:600;line-height:1.35}
.lt a:hover{color:var(--ac);text-decoration:underline}
.tl{font-weight:600}
.n{color:var(--mu);font-weight:500;font-size:.74rem;margin-right:6px;font-variant-numeric:tabular-nums}
.dt{font-size:.74rem;color:var(--ok);font-weight:600;margin-top:1px}
.nt{font-size:.78rem;color:var(--mu)}
.bd{font-size:.64rem;padding:3px 9px;border-radius:99px;background:var(--soft);font-weight:600;text-align:center;line-height:1.35;color:var(--mu);white-space:nowrap}
.bd.B{color:var(--lvB)}.bd.I{color:var(--lvI)}.bd.A{color:var(--lvA)}
.lk a{display:block;padding:14px 16px;margin:8px 0;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);color:var(--tx);font-weight:600;text-decoration:none}
.lk a:after{content:" →";color:var(--ac)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:16px;margin:0 0 14px}
.card.past{opacity:.6}
.card h3{margin:0 0 12px;font-size:.98rem;font-weight:650}
.cf{padding:6px 16px 16px;display:grid;gap:10px}
.cact{padding:4px 16px 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#app input:not([type=checkbox]):not([type=search]),#app select,#app textarea{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--glass2);color:var(--tx);font:inherit;font-size:.95rem}
#app textarea{min-height:70px;resize:vertical}
#mem select,#mem input[type=date]{margin-bottom:10px}
#sch input,#sch select{margin-bottom:10px}
.ch{margin-top:10px}
.xbtn{padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--glass2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--tx);font-size:.85rem;font-weight:600;cursor:pointer}
.xbtn.pri{background:var(--acr);color:var(--onac);border-color:transparent}
a.xbtn{display:block;text-align:center;text-decoration:none}
.ib{background:var(--soft);border:0;border-radius:99px;padding:4px 11px;font-size:.72rem;font-weight:600;color:var(--mu);cursor:pointer;margin:0 6px 4px 0}
a.ib{display:inline-block;text-decoration:none}
.acts{margin-top:6px}
.mrow,.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
.mnm{flex:1;font-weight:600}.mc{font-size:.78rem;color:var(--mu);font-variant-numeric:tabular-nums}
.pm{display:flex;gap:10px;align-items:center;padding:8px 2px;font-weight:500}
.pm input{width:20px;height:20px;accent-color:var(--ac)}
.tabs{position:fixed;left:calc(6px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:20;flex-direction:column;gap:3px;padding:5px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--bd);box-shadow:0 8px 30px rgba(20,40,90,.16)}
.tab{position:relative;width:48px;padding:8px 0 6px;border:0;border-radius:19px;background:transparent;color:var(--mu);font:600 .58rem/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--acr);color:var(--onac)}
.bg{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#ff453a;color:#fff;font:700 .62rem/16px system-ui,sans-serif;font-style:normal;text-align:center}
@media(max-width:820px){body.dock main{padding-left:70px}}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(29,29,31,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;padding:9px 18px;border-radius:99px;font-size:.84rem;font-weight:600;display:none;z-index:30}
footer{padding:22px 16px 30px;text-align:center;color:var(--mu);font-size:.72rem}
.cgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.cgrid{grid-template-columns:1fr 1fr;align-items:start}}
.ccard{text-align:center}.ccard h3{font-size:.95rem}
.big{font-size:3.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 10px;background:linear-gradient(90deg,#1aa6c9,#c04a9f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-variant-numeric:tabular-nums}
.cctl{display:flex;gap:10px;align-items:center;justify-content:center}
.cctl .xbtn{width:48px;height:44px;font-size:1.3rem;padding:0}
#app .cctl input{width:110px;text-align:center;font-size:1.15rem;font-weight:700}
.sp{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
