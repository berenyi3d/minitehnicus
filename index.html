:root{--bg:#f3f5f8;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--hero:#0f172a;--ok:#15803d;--ac:#0e8fa3;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#131a2b;--tx:#e6ebf5;--mu:#94a3b8;--bd:#232c42;--hero:#080d19;--ok:#4ade80;--ac:#2cb1c6;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#131a2b;--tx:#e6ebf5;--mu:#94a3b8;--bd:#232c42;--hero:#080d19;--ok:#4ade80;--ac:#2cb1c6;--sh:0 1px 2px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.kE{--c:#0e8fa3}.kP{--c:#c0298a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .kE{--c:#2cb1c6}:root:not([data-theme="light"]) .kP{--c:#e04fa8}}
header{background:var(--hero);color:#fff;padding:22px 16px 56px;position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#0e8fa3 0 33.4%,#c0298a 0 66.7%,#f5c400 0)}
header .in{max-width:760px;margin:0 auto;display:flex;gap:16px;align-items:center}
.logo{flex:none;width:68px;height:68px;border-radius:14px;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 1.6rem system-ui,sans-serif;overflow:hidden}
.logo.img{background:none;border-radius:0;overflow:visible}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.ey{display:block;font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#7dd3e0;margin-bottom:2px}
header h1{margin:0;font-size:1.5rem;line-height:1.15;font-weight:700;letter-spacing:-.01em}
header p{margin:5px 0 0;color:#94a3b8;font-size:.85rem}
main{max-width:760px;margin:0 auto;padding:0 16px 18px}
.stats{display:flex;gap:10px;margin:-30px 0 0;position:relative}
.stat{flex:1;background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:12px 6px;text-align:center;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.stat b{display:block;font-size:1.65rem;line-height:1.2;font-weight:700;color:var(--tx);letter-spacing:0;font-variant-numeric:tabular-nums}
.pb{height:6px;background:var(--bd);border-radius:3px;margin:14px 0 18px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0e8fa3,#c0298a);border-radius:3px;transition:width .4s}
.note{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:13px 15px;font-size:.85rem;color:var(--mu);margin:0 0 16px}
.mode{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:99px;background:var(--bg);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;margin:0 0 4px}
.bar input{flex:1 1 100%;width:100%;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;margin-bottom:10px;box-shadow:var(--sh)}
.bar input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.chip{flex:1 1 auto;white-space:nowrap;padding:9px 6px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:.78rem;font-weight:600;cursor:pointer;margin-left:-1px}
.chip:nth-of-type(1){border-radius:10px 0 0 10px;margin-left:0}.chip:last-of-type{border-radius:0 10px 10px 0}
.chip.on{background:var(--tx);color:var(--card);border-color:var(--tx);position:relative}
h2.sec{margin:26px 0 10px;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:12px}
h2.sec:after{content:"";flex:1;height:1px;background:var(--bd)}
details{background:var(--card);border-radius:14px;box-shadow:var(--sh);margin:10px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"";width:8px;height:8px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);margin:-4px 2px 0 0;transition:transform .15s;flex:none}
details[open] summary:after{transform:rotate(-135deg);margin-top:4px}
.ring{order:-1;flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}
.ring i{font-style:normal;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.66rem;font-weight:700;font-variant-numeric:tabular-nums}
.ut{flex:1;min-width:0}.ut b{font-size:1rem;font-weight:650;display:block;line-height:1.3}.ut small{display:block;color:var(--mu);font-size:.76rem;margin-top:1px}
.ud{padding:0 16px 8px;color:var(--mu);font-size:.85rem;margin:0}
.ls{padding:0 8px 6px}
.l{display:flex;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--bd)}
.l input{-webkit-appearance:none;appearance:none;width:22px;height:22px;flex:none;border:2px solid #b6bfcc;border-radius:50%;background:transparent;cursor:pointer;margin:0}
.l input:checked{background:var(--ok);border-color:var(--ok)}
.l input:checked:after{content:"";display:block;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin:1px 0 0 6px}
.ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff}
.ck.y{background:var(--ok);border-color:var(--ok)}
.lt{flex:1;min-width:0}
.lt a{color:var(--tx);text-decoration:none;font-weight:600;line-height:1.35}
.lt a:hover{color:var(--c);text-decoration:underline}
.n{color:var(--mu);font-weight:500;font-size:.74rem;margin-right:6px;font-variant-numeric:tabular-nums}
.dt{font-size:.74rem;color:var(--ok);font-weight:600;margin-top:1px}
.bd{font-size:.64rem;padding:3px 8px;border-radius:99px;background:var(--bg);font-weight:600;text-align:center;line-height:1.35;letter-spacing:.02em;color:var(--mu);white-space:nowrap}
.bd.B{color:var(--ok)}.bd.I{color:#b45309}.bd.A{color:#be123c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bd.I{color:#fbbf24}:root:not([data-theme="light"]) .bd.A{color:#fb7185}}
.lk a{display:block;padding:13px 15px;margin:8px 0;background:var(--card);border-radius:12px;box-shadow:var(--sh);color:var(--tx);font-weight:600;text-decoration:none}
.lk a:after{content:" →";color:var(--ac)}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--card);padding:9px 18px;border-radius:99px;font-size:.84rem;font-weight:600;display:none;z-index:9}
footer{padding:20px 16px 30px;text-align:center;color:var(--mu);font-size:.72rem}
.mb{margin:14px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mb .mode{margin:0}.xbtn{padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:.8rem;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--bd)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:.9rem;font-weight:600;color:var(--mu);cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--tx);border-bottom-color:var(--ac)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 12px;font-size:.95rem;font-weight:650}
#app input:not([type=checkbox]):not([type=search]),#app select,#app textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:.95rem}
#app textarea{min-height:70px;resize:vertical}
.cf{padding:6px 16px 16px;display:grid;gap:10px}
.cact{padding:4px 16px 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#mem select,#mem input[type=date]{margin-bottom:10px}
.xbtn.pri{background:var(--ac);color:var(--card);border-color:var(--ac)}
.ib{background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 9px;font-size:.72rem;color:var(--mu);cursor:pointer;margin-right:6px}
.acts{margin-top:6px}.nt{font-size:.78rem;color:var(--mu)}.tl{font-weight:600}
.mrow,.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
.mnm{flex:1;font-weight:600}.mc{font-size:.78rem;color:var(--mu);font-variant-numeric:tabular-nums}
.pm{display:flex;gap:10px;align-items:center;padding:8px 2px;font-weight:500}
.pm input{width:20px;height:20px;accent-color:var(--ac)}
.kC{--c:#d4a017}
a.xbtn{display:block;text-align:center;text-decoration:none;padding:10px 12px}
a.ib{display:inline-block;text-decoration:none}
.card.past{opacity:.6}
.ch{margin-top:10px}
